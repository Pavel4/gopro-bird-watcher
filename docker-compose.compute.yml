# Docker Compose для compute-роли (ML Inference Server)
#
# Запуск:
#   docker-compose -f docker-compose.compute.yml up -d
#
# Для NVIDIA GPU (требуется nvidia-container-toolkit):
#   docker-compose -f docker-compose.compute.yml \
#       --profile gpu up -d
#
# Логи:
#   docker-compose -f docker-compose.compute.yml logs -f

services:
  inference-server:
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: birdwatcher-compute
    volumes:
      - .:/app
    ports:
      - "${GRPC_SERVER_PORT:-50051}:50051"
    environment:
      - TZ=Europe/Moscow
      - GRPC_SERVER_PORT=50051
      # ML настройки
      - ML_ENABLED=true
      - ML_MODEL_DIR=/app/models
      - ML_CONFIDENCE_THRESHOLD=${ML_CONFIDENCE_THRESHOLD:-0.5}
      - ML_SPECIES_ENABLED=${ML_SPECIES_ENABLED:-true}
      - ML_BEHAVIOR_ENABLED=${ML_BEHAVIOR_ENABLED:-false}
      - ML_BEHAVIOR_NUM_FRAMES=${ML_BEHAVIOR_NUM_FRAMES:-8}
      - ML_BEHAVIOR_CONFIDENCE=${ML_BEHAVIOR_CONFIDENCE:-0.4}
    working_dir: /app
    command: python -u detector/inference_server.py
    restart: unless-stopped

  # Профиль для NVIDIA GPU
  # Запуск: docker-compose --profile gpu up
  inference-server-gpu:
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: birdwatcher-compute-gpu
    profiles:
      - gpu
    volumes:
      - .:/app
    ports:
      - "${GRPC_SERVER_PORT:-50051}:50051"
    environment:
      - TZ=Europe/Moscow
      - GRPC_SERVER_PORT=50051
      - ML_ENABLED=true
      - ML_MODEL_DIR=/app/models
      - ML_CONFIDENCE_THRESHOLD=${ML_CONFIDENCE_THRESHOLD:-0.5}
      - ML_SPECIES_ENABLED=${ML_SPECIES_ENABLED:-true}
      - ML_BEHAVIOR_ENABLED=${ML_BEHAVIOR_ENABLED:-false}
      - ML_BEHAVIOR_NUM_FRAMES=${ML_BEHAVIOR_NUM_FRAMES:-8}
      - ML_BEHAVIOR_CONFIDENCE=${ML_BEHAVIOR_CONFIDENCE:-0.4}
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python -u detector/inference_server.py
    restart: unless-stopped
